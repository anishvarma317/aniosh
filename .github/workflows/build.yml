name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Project Dependencies via Bun
        run: bun install

      - name: Force Install Capacitor Core Packages
        run: bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor Configuration
        run: npx @capacitor/cli init "aniosh" "com.myapp.test" --web-dir=dist || true

      - name: Compile Vite Web Assets
        run: bun run build

      - name: Build and Inject Android Container
        run: |
          npx @capacitor/cli add android || true
          npx @capacitor/cli sync android

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Completed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
